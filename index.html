<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akram AI Trader</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
header{
  text-align:center;
  padding:25px 10px;
}
h1{
  margin:0;
  font-size:32px;
}
.subtitle{
  color:#9ca8c7;
  margin-top:8px;
}
.card{
  background:#151c31;
  border:1px solid #273252;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
}
.status{
  display:flex;
  align-items:center;
  gap:10px;
}
.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#20d879;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
}
.coin{
  background:#10172a;
  border-radius:12px;
  padding:15px;
}
.coin b{
  display:block;
  font-size:18px;
  margin-bottom:8px;
}
.price{
  font-size:20px;
}
.green{color:#20d879}
.red{color:#ff5c6c}
.signal{
  text-align:center;
  padding:18px;
  border-radius:12px;
  background:#10172a;
}
.signal strong{
  font-size:26px;
}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
}
footer{
  text-align:center;
  color:#697594;
  padding:20px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>🤖 Akram AI Trader</h1>
  <div class="subtitle">وكيل ذكاء اصطناعي لتحليل العملات الرقمية</div>
</header>

<div class="card">
  <div class="status">
    <span class="dot"></span>
    <b>النظام يعمل</b>
  </div>
  <p>المراقبة والتحليل الآلي للعملات الرقمية</p>
</div>

<div class="card">
  <h2>📊 السوق</h2>

  <div class="grid">

    <div class="coin">
      <b>Bitcoin
