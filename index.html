<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akram AI Trader</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080d19;
  color:#fff;
}

.container{
  max-width:950px;
  margin:auto;
  padding:18px;
}

header{
  text-align:center;
  padding:25px 10px;
}

h1{
  margin:0;
  font-size:30px;
}

.subtitle{
  color:#9aa6c2;
  margin-top:8px;
}

.card{
  background:#121a2b;
  border:1px solid #263452;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}

.status{
  display:flex;
  align-items:center;
  gap:9px;
}

.dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:#20d879;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

.coin{
  background:#0d1424;
  border-radius:12px;
  padding:15px;
}

.coin b{
  display:block;
  margin-bottom:8px;
  font-size:17px;
}

.price{
  font-size:21px;
  font-weight:bold;
}

.change{
  margin-top:7px;
  font-size:14px;
}

.green{color:#20d879}
.red{color:#ff5c6c}
.gray{color:#9aa6c2}

.signal{
  text-align:center;
  background:#0d1424;
  border-radius:14px;
  padding:22px;
}

.signal strong{
  font-size:28px;
}

.analysis{
  color:#b5bfd5;
  line-height:1.7;
}

.info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}

.info div{
  background:#151f34;
  padding:13px;
  border-radius:10px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.small{
  color:#71809f;
  font-size:13px;
  text-align:center;
  margin-top:12px;
}

footer{
  text-align:center;
  color:#66738f;
  padding:18px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>🤖 Akram AI Trader</h1>
  <div class="subtitle">
    وكيل ذكاء اصطناعي لتحليل سوق العملات الرقمية
  </div>
</header>

<div class="card">
  <div class="status">
    <span class="dot"></span>
    <b>النظام متصل</b>
  </div>

  <p class="gray">
    تحليل تجريبي للسوق اعتماداً على بيانات الأسعار العامة.
  </
